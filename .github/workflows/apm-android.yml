name: Android v0.2 APM build
on:
  push:
    branches: [feature/v02-live-webrtc-apm-test]
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Stage pinned Android WebRTC APM
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Sqhh99/webrtc-audio-processing/releases/download/m155.8059.4.0/webrtc-audio-processing.android.tar.gz" \
            -o /tmp/webrtc-apm.tar.gz
          echo "0d9d3d9d801e2cfcd3b73a7296352037ac6c0b41a2632bee675c0162913e253b  /tmp/webrtc-apm.tar.gz" | sha256sum --check -
          mkdir -p /tmp/apm app/src/main/apm/include app/src/main/jniLibs/arm64-v8a
          tar xzf /tmp/webrtc-apm.tar.gz -C /tmp/apm
          cp -a /tmp/apm/include/. app/src/main/apm/include/
          cp /tmp/apm/lib/arm64-v8a/libwebrtc-audio-processing-3.so app/src/main/jniLibs/arm64-v8a/
          mkdir -p app/src/main/assets/third_party_licenses
          cp -a /tmp/apm/licenses/. app/src/main/assets/third_party_licenses/
      - name: Compile Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: s9-hfp-soundengine-v02-debug
          path: app/build/outputs/apk/debug/app-debug.apk
